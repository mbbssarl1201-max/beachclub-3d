services:
  beachclub:
    build:
      context: .
    image: beachclub-3d:latest
    container_name: beachclub-3d
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=3001
      - PGLITE_DATA=/data
      # Sonnet 5 : latence basse pour la boucle vocale temps réel (NFR5), le plan
      # prévoyait déjà Sonnet pour coût/latence. Repasser sur claude-opus-4-8 si besoin.
      - CLAUDE_MODEL=claude-sonnet-5
    volumes:
      - beachclub_data:/data
    networks:
      - internal
    labels:
      - traefik.enable=true
      - traefik.http.routers.beachclub.rule=Host(`beachclub.76-13-55-44.sslip.io`)
      - traefik.http.routers.beachclub.entrypoints=websecure
      - traefik.http.routers.beachclub.tls.certresolver=letsencrypt
      - traefik.http.services.beachclub.loadbalancer.server.port=3001

networks:
  internal:

volumes:
  beachclub_data: {}
